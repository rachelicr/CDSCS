site_name: Cancer Data Science Cheat Sheets
site_description: Glossary-style cheat sheets for cancer data science
repo_url: https://github.com/YOUR_USERNAME/cancer-ds-cheatsheets
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Statistics: statistics.md
  - Machine Learning: machine-learning.md
  - Bioinformatics: bioinformatics.md
  - Genomics: genomics.md
  - Proteomics: proteomics.md
  - Instruments: instruments.md
  - Imaging: imaging.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
